<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelFilms</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body>

    <div class="off-screen-menu">
        <ul>
            <li class="off-menu"><a href="#recent-movies">Movies</a></li>
            <li class="off-menu"><a href="#Recent-series">Series</a></li>
            <li class="contact-link"><a class="contact-link" href="#">Contact</a></li>
        </ul>
    </div>

    <nav class="navbar">
        <div class="hamburger-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="projected-links">
            <li class="left-link"><a href="#">ReelFilms <img class="film-reel--img" src="./Assets/Capture.PNG" alt=""></a></li>
            <li class="right-link"><a href="#recent-movies">Movies</a></li>
            <li class="right-link"><a href="#Recent-series">Series</a></li>
            <li class="right-link" class="contact-link"><a class="contact-link" href="#">Contact</a></li>
        </ul>
    </nav>
    
    <section class="content">
        <div class="search-wrapper">
            <img class="popcorn-img" src="./Assets/Popcorn pic.PNG" alt="Popcorn">
            <form class="search-form" onsubmit="return false;">
                <input id="searchInput" class="search-input" type="text" placeholder="Search Movies or TV Shows">
            </form>
        </div>
<div id="movieResults" class="movie-results"></div>
</section>
   

    <section class="video-background">
        <iframe 
        src="https://www.youtube.com/embed/QBX8NZpBbd0?autoplay=1&mute=1&loop=1&playlist=QBX8NZpBbd0&controls=0&modestbranding=1&showinfo=0&vq=hd1080"
        frameborder="0" 
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
        allowfullscreen>
    </iframe>
    <div class="overlay">

        <img class="theater-seats" src="./Assets/10.PNG" alt="Theater Seats">
    </div>
    </section>

    

    
    <section id="recent-movies">
        <h2>Recent Movies</h2>
        <div class="carousel">
            <button class="arrow left">&#10094;</button>
            <div class="movie-scroll-wrapper">
                <div id="recentMovies" class="movie-scroll">

                </div>
            </div>
            <button class="arrow right">&#10095;</button>
        </div>
    </section>

    <section id="Recent-series" class="recent-series">
        <h2>Recent Series</h2>
        <div class="series-scroll">
            
        </div>
    </section>
    <script src="app.js" defer></script>
</body>
</html>
