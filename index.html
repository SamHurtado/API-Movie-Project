<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelFilms</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body>

    <div class="video-background">
         <iframe 
            src="https://www.youtube.com/embed/QBX8NZpBbd0?autoplay=1&mute=1&loop=1&playlist=QBX8NZpBbd0&controls=0&modestbranding=1&showinfo=0&vq=hd1080"
            frameborder="0" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
             allowfullscreen>
        </iframe>
        <div class="overlay"></div>
    </div>

    <nav class="navbar">
        <ul>
            <li><a href="#">ReelFilms</a></li>
            <li><a href="#">Movies</a></li>
            <li><a href="#">Series</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <section class="content">
        <h1>Welcome to ReelFilms</h1>
        <form class="search-form" onsubmit="return flase;">
            <input id="searchInput" class="search-input" type="text" placeholder="Search Movies or TV Shows">
        </form>
        <div id="movieResults" class="movie-results"></div>
    </section>

</body>
</html>
